name: Historical Telegram replay endpoint checks

on:
  push:
    branches:
      - diagnostics/historical-telegram-alert-replay
      - fix/durable-historical-replay-guard

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check bot syntax
        run: node --check bot.js
      - name: Run repository tests
        run: npm test
